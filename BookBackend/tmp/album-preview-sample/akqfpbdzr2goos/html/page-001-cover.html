<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>我们的纪念 - 封面</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: linear-gradient(180deg, #f6f0e8, #fffaf4);
      color: #5c4632;
      font-family: "Noto Serif SC", serif;
    }

    .page {
      width: 900px;
      max-width: calc(100vw - 48px);
      padding: 32px;
      background: rgba(255, 255, 255, 0.72);
      border-radius: 28px;
      box-shadow: 0 18px 60px rgba(0, 0, 0, 0.12);
      text-align: center;
    }

    img {
      width: 100%;
      border-radius: 24px;
      display: block;
      margin-top: 24px;
    }

    h1 {
      margin: 0;
      font-size: 48px;
    }

    p {
      margin: 12px 0 0;
      font-size: 20px;
      color: #8a6d52;
    }
  </style>
</head>
<body>
  <article class="page">
    <h1>我们的纪念</h1>
    <p>把时间折成书页，把日子存成风景</p>
    <img src="../assets/cover-hero.svg" alt="封面主图">
  </article>
</body>
</html>
