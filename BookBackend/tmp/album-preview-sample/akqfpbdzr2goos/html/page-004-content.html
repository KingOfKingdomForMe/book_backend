<!doctype html>
<html lang="zh-CN">
<head>

    <img class="photo" src="../assets/content-01.svg" alt="正文配图">
    <div class="meta">

      <span>杭州</span>
    </div>
    <div class="body">
      我们在西湖边待了很久，天光慢慢暗下去，风也吹得更轻。那天没有什么大事发生，但照片留下来的，是一种刚刚好的平静。
